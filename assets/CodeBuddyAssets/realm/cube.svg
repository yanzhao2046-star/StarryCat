<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.03 -0.03 1.8 2.08">
  <!-- 基准方块：等距立方体（棱长投影 = 1），无圆角，浅紫三面 + 深灰描边
       渲染时按 s（基准棱长 rpx）缩放：元素宽 1.8s × 高 2.08s
       底面下顶点 (0.866, 2)，即等距网格的一个交点 -->
  <!-- 顶面 -->
  <polygon points="0.866,0 1.732,0.5 0.866,1 0,0.5" fill="#F4F5FB"/>
  <!-- 左面 -->
  <polygon points="0,0.5 0.866,1 0.866,2 0,1.5" fill="#E6E9F4"/>
  <!-- 右面 -->
  <polygon points="0.866,1 1.732,0.5 1.732,1.5 0.866,2" fill="#DADFEF"/>
  <!-- 外轮廓 + 顶面两条棱 + 中棱 -->
  <g fill="none" stroke="#3A3A44" stroke-width="0.03" stroke-linejoin="miter">
    <polygon points="0.866,0 1.732,0.5 1.732,1.5 0.866,2 0,1.5 0,0.5"/>
    <polyline points="0,0.5 0.866,1 1.732,0.5"/>
    <line x1="0.866" y1="1" x2="0.866" y2="2"/>
  </g>
</svg>
